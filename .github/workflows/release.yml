name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Check the tag is on main and matches the mod version
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main" >&2
            exit 1
          fi
          version=$(grep -m1 '^version = ' mod.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match mod.toml version $version" >&2
            exit 1
          fi

      - name: Install toolchain
        run: sudo apt-get update && sudo apt-get install -y clang lld make zip

      - name: Download RecompModTool
        run: |
          curl -sSLo RecompModTool https://github.com/N64Recomp/N64Recomp/releases/download/mod-tool-release/RecompModTool
          chmod +x RecompModTool

      - name: Build and package
        run: ./package.sh

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="## ${GITHUB_REF_NAME#v}" '$0 == v {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" build/mm_recomp_3d_grottos.nrm dist/*.zip \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
